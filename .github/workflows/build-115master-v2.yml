name: Build 115Master v2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout upstream v2
        uses: actions/checkout@v4
        with:
          repository: cbingb666/115master
          ref: v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Apply Firefox playback compatibility patch
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          function replaceOnce(file, before, after) {
            const source = fs.readFileSync(file, 'utf8').replace(/\r\n/g, '\n')
            if (!source.includes(before)) {
              throw new Error(`Firefox playback patch target not found in ${file}`)
            }
            fs.writeFileSync(file, source.replace(before, after))
          }

          function replacePattern(file, pattern, after) {
            const source = fs.readFileSync(file, 'utf8').replace(/\r\n/g, '\n')
            if (!pattern.test(source)) {
              throw new Error(`Firefox playback patch target not found in ${file}`)
            }
            fs.writeFileSync(file, source.replace(pattern, after))
          }

          replaceOnce(
            'apps/monkey/src/components/XPlayer/hooks/playerCore/useAvPlayerCore.ts',
            "const CDN_URL_WASM = `${CDN_BASE_URL}/gh/zhaohappy/libmedia@latest/dist`",
            "const CDN_URL_WASM = `${CDN_BASE_URL}/gh/zhaohappy/libmedia@v1.2.0/dist`",
          )

          replaceOnce(
            'apps/monkey/src/components/XPlayer/hooks/playerCore/useAvPlayerCore.ts',
            '  enableHardware: true,',
            '  enableHardware: false,',
          )

          replaceOnce(
            'apps/monkey/src/components/XPlayer/hooks/playerCore/useAvPlayerCore.ts',
            '  enableWebCodecs: true,',
            '  enableWebCodecs: false,',
          )

          replaceOnce(
            'apps/monkey/src/components/XPlayer/hooks/playerCore/useAvPlayerCore.ts',
            '  enableWebGPU: true,',
            '  enableWebGPU: false,',
          )

          replaceOnce(
            'apps/monkey/src/components/XPlayer/hooks/playerCore/useAvPlayerCore.ts',
            '  enableWorker: true,',
            '  enableWorker: false,',
          )

          replaceOnce(
            'apps/monkey/src/components/XPlayer/hooks/playerCore/useAvPlayerCore.ts',
            [
              "          pkgName: '@libmedia/avplayer',",
              "          path: 'dist/esm/avplayer.js',",
            ].join('\n'),
            [
              "          pkgName: '@libmedia/avplayer',",
              "          version: '1.2.2',",
              "          path: 'dist/esm/avplayer.js',",
            ].join('\n'),
          )

          replaceOnce(
            'apps/monkey/src/components/XPlayer/hooks/playerCore/useCatchVideo.ts',
            [
              '    if (!el)',
              '      return',
              '',
              '    defer(() => {',
            ].join('\n'),
            [
              '    if (!el)',
              '      return',
              '',
              "    const isFirefox = navigator.userAgent.toLowerCase().includes('firefox')",
              "      || CSS.supports('-moz-appearance', 'none')",
              '    if (isFirefox)',
              '      return',
              '',
              '    defer(() => {',
            ].join('\n'),
          )

          replacePattern(
            'apps/monkey/src/components/XPlayer/hooks/playerCore/useCatchVideo.ts',
            /    if \(metadata\.processingDuration === undefined\) \{\r?\n      errCount\+\+[\s\S]*?\r?\n    \}\r?\n\r?\n    checkDroppedFrames\(\)/,
            [
              '    if (metadata.processingDuration === undefined) {',
              "      logger.warn('Video frame processingDuration is unavailable; disable the unreliable frame-drop probe.', metadata)",
              '      requestId = null',
              '      return',
              '    }',
              '',
              '    errCount = 0',
              '    checkDroppedFrames()',
            ].join('\n'),
          )

          replaceOnce(
            'apps/monkey/src/components/XPlayer/hooks/playerCore/useAvPlayerCore.ts',
            [
              '  const getPreferredAudioStream = (streams: Stream[]) => {',
              '    return streams.find((stream) => {',
              '      return (',
              "        stream.mediaType === 'Audio'",
              '        && stream.codecparProxy.chLayout.nbChannels <= 8',
              "        && stream.metadata.language === 'eng'",
              '      )',
              '    })',
              '  }',
            ].join('\n'),
            [
              '  const getPreferredAudioStream = (streams: Stream[]) => {',
              '    const compatibleAudioStreams = streams.filter((stream) => {',
              '      return (',
              "        stream.mediaType === 'Audio'",
              '        && stream.codecparProxy.chLayout.nbChannels <= 8',
              '        && isSupportStream(stream)',
              '      )',
              '    })',
              '',
              '    return compatibleAudioStreams.find(',
              "      stream => stream.metadata.language === 'eng',",
              '    ) ?? compatibleAudioStreams[0]',
              '  }',
            ].join('\n'),
          )

          replaceOnce(
            'apps/monkey/src/components/XPlayer/hooks/playerCore/useAvPlayerCore.ts',
            [
              '      state.muted.value = muted',
              '      player.setVolume(muted ? 0 : 100)',
            ].join('\n'),
            [
              '      state.muted.value = muted',
              '      const volume = (state.volume.value / 100) * 3',
              '      player.setVolume(muted ? 0 : volume)',
            ].join('\n'),
          )

          replaceOnce(
            'apps/monkey/src/components/XPlayer/hooks/playerCore/useAvPlayerCore.ts',
            [
              '        player.on(AVPlayerEvents.PAUSED, () => {',
              '          ctx.eventMitt.emit(EVENTS.PAUSED, ctx)',
              '          state.paused.value = true',
              '        })',
              '        player.on(AVPlayerEvents.LOADED, () => {',
            ].join('\n'),
            [
              '        player.on(AVPlayerEvents.PAUSED, () => {',
              '          ctx.eventMitt.emit(EVENTS.PAUSED, ctx)',
              '          state.paused.value = true',
              '        })',
              '        player.on(AVPlayerEvents.RESUME, () => {',
              '          state.isSuspended.value = true',
              '        })',
              '        player.on(AVPlayerEvents.AUDIO_CONTEXT_RUNNING, () => {',
              '          state.isSuspended.value = false',
              '        })',
              '        player.on(AVPlayerEvents.LOADED, () => {',
            ].join('\n'),
          )

          replaceOnce(
            'apps/monkey/src/components/XPlayer/hooks/playerCore/useAvPlayerCore.ts',
            [
              '      await player.resume()',
              '      state.isSuspended.value = false',
            ].join('\n'),
            [
              '      await player.resume()',
              '      state.isSuspended.value = player.isSuspended()',
            ].join('\n'),
          )

          replaceOnce(
            'apps/monkey/src/components/XPlayer/hooks/useSources.ts',
            [
              '  const getDefaultPlayerCore = (source: VideoSource) => {',
              "    if (source.type === 'hls') {",
            ].join('\n'),
            [
              '  const getDefaultPlayerCore = (source: VideoSource) => {',
              "    if (source.displayQuality === 'Ultra') {",
              '      return PlayerCoreType.AvPlayer',
              '    }',
              "    if (source.type === 'hls') {",
            ].join('\n'),
          )

          replaceOnce(
            'apps/monkey/src/components/XPlayer/hooks/useSources.ts',
            [
              '      ctx.eventMitt.on(EVENTS.ERROR, ([_, err]) => {',
              '        if (err === VIDEO_CATCH_ERROES.VIDEO_TRACK_LOSS) {',
            ].join('\n'),
            [
              '      ctx.eventMitt.on(EVENTS.ERROR, ([_, err]) => {',
              "        const isFirefox = navigator.userAgent.toLowerCase().includes('firefox')",
              "          || CSS.supports('-moz-appearance', 'none')",
              '        const isUnreliableFirefoxDiagnostic = isFirefox && (',
              '          err === VIDEO_CATCH_ERROES.VIDEO_TRACK_LOSS',
              '          || err === VIDEO_CATCH_ERROES.VIDEO_FRAMED_DROPPED',
              '        )',
              '        if (isUnreliableFirefoxDiagnostic) {',
              "          logger.warn('Ignore unreliable Firefox video diagnostic', err)",
              '          return',
              '        }',
              '',
              '        if (err === VIDEO_CATCH_ERROES.VIDEO_TRACK_LOSS) {',
            ].join('\n'),
          )

          replaceOnce(
            'apps/monkey/src/components/XPlayer/hooks/useSources.ts',
            [
              '    catch (error) {',
              '      if (error instanceof Error || error instanceof MediaError) {',
              '        if (hlsSource && playerCore?.value?.type !== PlayerCoreType.Hls) {',
            ].join('\n'),
            [
              '    catch (error) {',
              '      if (error instanceof Error || error instanceof MediaError) {',
              "        if (source.displayQuality === 'Ultra') {",
              "          logger.error('Firefox Ultra compatibility player failed', error)",
              '          if (playerCore.value)',
              '            playerCore.value.loadError = error',
              '          return',
              '        }',
              '',
              '        if (hlsSource && playerCore?.value?.type !== PlayerCoreType.Hls) {',
            ].join('\n'),
          )

          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build userscript
        run: pnpm build

      - name: Prepare installable userscript
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const version = `2.0.${process.env.GITHUB_RUN_NUMBER}`
          const baseUrl = `https://raw.githubusercontent.com/${process.env.GITHUB_REPOSITORY}/published`
          const files = [
            'apps/monkey/dist/115master.user.js',
            'apps/monkey/dist/115master.meta.js',
          ]

          for (const file of files) {
            let content = fs.readFileSync(file, 'utf8')
            content = content.replace(/^\/\/ @version\s+.*$/m, `// @version      ${version}`)
            content = content.replace(
              /^\/\/ @downloadURL\s+.*$/m,
              `// @downloadURL  ${baseUrl}/115master.user.js`,
            )
            content = content.replace(
              /^\/\/ @updateURL\s+.*$/m,
              `// @updateURL    ${baseUrl}/115master.meta.js`,
            )
            fs.writeFileSync(file, content)
          }
          NODE

      - name: Publish installable userscript
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir publish
          cp apps/monkey/dist/115master.user.js publish/
          cp apps/monkey/dist/115master.meta.js publish/
          cd publish
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b published
          git add 115master.user.js 115master.meta.js
          git commit -m "Publish userscript build ${GITHUB_RUN_NUMBER}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin published

      - name: Upload userscript artifact
        uses: actions/upload-artifact@v4
        with:
          name: 115master-v2-userscript
          path: |
            apps/monkey/dist/115master.user.js
            apps/monkey/dist/115master.meta.js
