name: Build 115Master v2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout upstream v2
        uses: actions/checkout@v4
        with:
          repository: cbingb666/115master
          ref: v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Apply Firefox playback compatibility patch
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const file = 'apps/monkey/src/components/XPlayer/hooks/playerCore/useCatchVideo.ts'
          const source = fs.readFileSync(file, 'utf8')

          const before = `    if (metadata.processingDuration === undefined) {
                errCount++`

          const after = `    const isFirefox = navigator.userAgent.toLowerCase().includes('firefox')
              if (isFirefox) {
                logger.warn('Firefox does not provide reliable video frame timing metadata; ignore this frame-drop probe.', metadata)
                checkDroppedFrames()
                return
              }

              if (metadata.processingDuration === undefined) {
                errCount++`

          if (!source.includes(before)) {
            throw new Error('Firefox playback patch target not found')
          }

          fs.writeFileSync(file, source.replace(before, after))

          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build userscript
        run: pnpm build

      - name: Prepare installable userscript
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const version = `2.0.${process.env.GITHUB_RUN_NUMBER}`
          const baseUrl = `https://raw.githubusercontent.com/${process.env.GITHUB_REPOSITORY}/published`
          const files = [
            'apps/monkey/dist/115master.user.js',
            'apps/monkey/dist/115master.meta.js',
          ]

          for (const file of files) {
            let content = fs.readFileSync(file, 'utf8')
            content = content.replace(/^\/\/ @version\s+.*$/m, `// @version      ${version}`)
            content = content.replace(
              /^\/\/ @downloadURL\s+.*$/m,
              `// @downloadURL  ${baseUrl}/115master.user.js`,
            )
            content = content.replace(
              /^\/\/ @updateURL\s+.*$/m,
              `// @updateURL    ${baseUrl}/115master.meta.js`,
            )
            fs.writeFileSync(file, content)
          }
          NODE

      - name: Publish installable userscript
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir publish
          cp apps/monkey/dist/115master.user.js publish/
          cp apps/monkey/dist/115master.meta.js publish/
          cd publish
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b published
          git add 115master.user.js 115master.meta.js
          git commit -m "Publish userscript build ${GITHUB_RUN_NUMBER}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin published

      - name: Upload userscript artifact
        uses: actions/upload-artifact@v4
        with:
          name: 115master-v2-userscript
          path: |
            apps/monkey/dist/115master.user.js
            apps/monkey/dist/115master.meta.js
