name: Build 115Master v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout upstream v2
        uses: actions/checkout@v4
        with:
          repository: cbingb666/115master
          ref: v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Apply Firefox playback compatibility patch
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const file = 'apps/monkey/src/components/XPlayer/hooks/playerCore/useCatchVideo.ts'
          const source = fs.readFileSync(file, 'utf8')

          const before = `    if (metadata.processingDuration === undefined) {
                errCount++`

          const after = `    const isFirefox = navigator.userAgent.toLowerCase().includes('firefox')
              if (isFirefox && metadata.processingDuration === undefined) {
                logger.warn('Firefox does not provide reliable processingDuration metadata; ignore this frame-drop probe.', metadata)
                checkDroppedFrames()
                return
              }

              if (metadata.processingDuration === undefined) {
                errCount++`

          if (!source.includes(before)) {
            throw new Error('Firefox playback patch target not found')
          }

          fs.writeFileSync(file, source.replace(before, after))
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build userscript
        run: pnpm build

      - name: Upload userscript artifact
        uses: actions/upload-artifact@v4
        with:
          name: 115master-v2-userscript
          path: |
            apps/monkey/dist/115master.user.js
            apps/monkey/dist/115master.meta.js
